# Adapted from r-lib/actions/examples/pkgdown.yaml
# https://github.com/r-lib/actions/tree/v2/examples
#
# NOTE: this workflow PUBLISHES the site on every push to main, by committing
# the built site to the gh-pages branch. GitHub Pages must therefore serve
# from that branch (Settings > Pages > Source: Deploy from a branch,
# gh-pages, / (root)), not from "GitHub Actions".
#
# Every action is pinned to a full commit SHA, with its tag as a comment.
# The site is built in a job with read-only permissions; only the deploy
# job, which runs no R code, may write to the repository.
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (= v6.1.0)

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2 (= v2.14.0)

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2 (= v2.14.0)
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2 (= v2.14.0)
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Keep the built site for the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (= v7.0.2)
        with:
          name: pkgdown-site
          path: docs
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    steps:
      # The deploy action authenticates with its own `token` input (default
      # github.token), so the checkout keeps no credentials in .git/config.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (= v6.1.0)
        with:
          persist-credentials: false

      - name: Fetch the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 (= v8.0.2)
        with:
          name: pkgdown-site
          path: docs

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
